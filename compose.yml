services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calirko-bin
    hostname: calirko-bin
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      PORT: "3000"
      ORIGIN: ${ORIGIN}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SECRET: ${ADMIN_SECRET}
      DATABASE_PATH: /app/data/db.json
      ANALYTICS_DB_PATH: /app/data/analytics.db
      # ANALYTICS_SALT falls back to ADMIN_SECRET if unset
      ANALYTICS_SALT: ${ANALYTICS_SALT:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-calirko-bin}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-104857600}
      LASTFM_API_KEY: ${LASTFM_API_KEY}
    volumes:
      - db-data:/app/data
    networks:
      dragon:
        aliases:
          - calirko-bin
    healthcheck:
      # UA is tagged so analytics (BOT_RE in capture.ts) skips these probes.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/',{headers:{'user-agent':'calirko-healthcheck'}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  db-data:

networks:
  dragon:
    external: true
