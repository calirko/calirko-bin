services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      # SvelteKit requires ORIGIN in production for CSRF protection
      ORIGIN: ${ORIGIN}
      # Database (persisted in the volume below)
      DATABASE_PATH: /app/data/db.json
      # MinIO
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-calirko-bin}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      # Raise body limit for file uploads (bytes, default is 512kb)
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-10485760}
    volumes:
      - db-data:/app/data
    networks:
      - traefik
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  db-data:

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
